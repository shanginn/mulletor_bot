name: Build and Deploy

on:
  push:
    branches: [ master ]

concurrency:
  group: mulletor-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/shanginn/mulletor_bot@${{ steps.image.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push exact image
        id: image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/shanginn/mulletor_bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.5
      - name: Deploy to unified mulletor namespace
        env:
          DEPLOY_KUBECONFIG: ${{ secrets.KUBECONFIG }}
          IMAGE: ${{ needs.build.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          export DEPLOY_WORK="$work"
          tunnel_pid=""
          cleanup() {
            if [ -n "$tunnel_pid" ]; then kill "$tunnel_pid" 2>/dev/null || true; fi
            rm -rf "$work"
          }
          trap cleanup EXIT
          python3 - <<'PY'
          import base64,json,os,pathlib
          root=pathlib.Path(os.environ['DEPLOY_WORK'])
          config=json.loads(os.environ['DEPLOY_KUBECONFIG'])
          cluster=config['clusters'][0]['cluster']
          extension=next(e['extension'] for e in cluster.pop('extensions') if e['name']=='infra-ssh-tunnel')
          assert extension['host']=='89.35.119.225' and extension['port']==42242 and extension['user']=='ci-mulletor'
          assert cluster['server']=='https://100.96.0.1:6443' and cluster['proxy-url']=='socks5://127.0.0.1:1080'
          assert config['contexts'][0]['context']['namespace']=='mulletor'
          (root/'key').write_bytes(base64.b64decode(extension['private-key-data']))
          (root/'known_hosts').write_text('[89.35.119.225]:42242 '+extension['host-key']+'\n')
          (root/'config').write_text(json.dumps(config))
          PY
          unset DEPLOY_KUBECONFIG
          ssh -F /dev/null -N -D 127.0.0.1:1080 -p 42242 \
            -i "$work/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" \
            -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 ci-mulletor@89.35.119.225 &
          tunnel_pid=$!
          export KUBECONFIG="$work/config"
          for attempt in 1 2 3 4 5; do
            if kubectl --request-timeout=15s -n mulletor get deployment mulletor-app >/dev/null; then break; fi
            kill -0 "$tunnel_pid"
            sleep 2
          done
          [[ "$IMAGE" =~ ^ghcr\.io/shanginn/mulletor_bot@sha256:[0-9a-f]{64}$ ]]
          kubectl --request-timeout=30s -n mulletor set image deployment/mulletor-app app="$IMAGE"
          kubectl --request-timeout=30s -n mulletor rollout status deployment/mulletor-app --timeout=300s
